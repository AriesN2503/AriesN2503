name: Update WakaTime Stats

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  waka:
    name: Refresh README coding activity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Update README with WakaTime stats
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECTION_NAME: waka
          SHOW_TITLE: false
          TIME_RANGE: last_7_days
          LANG_COUNT: 6
          SHOW_TIME: true
          SHOW_TOTAL: true
          CODE_LANG: txt
          COMMIT_MESSAGE: "chore: update wakatime stats"
          TARGET_BRANCH: main

          # Add WAKATIME_API_KEY in repository secrets before enabling this workflow.
